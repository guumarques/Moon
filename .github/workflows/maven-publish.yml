name: Maven Package

on:
  push:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Test with Maven
        run: mvn --batch-mode clean test

      - name: Generate report
        run: mvn surefire-report:report-only
        if: always()

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-tests
          path: target/reports/surefire.html

  Build:
    needs: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Prepare artifact
        run: mkdir staging && cp target/*.jar staging

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging


  Deploy:
    needs: [ Test, Build ]
    runs-on: ubuntu-latest
    steps:
      - name: Setup Square Cloud
        uses: squarecloudofc/github-action@v2 # in "command" you can add the --restart flag to restart your application after the commit
        with:
          command: commit ${{ secrets.SQUARE_APPLICATION_ID }}
          token: '${{ secrets.SQUARE_TOKEN }}'

  Notification:
    name: Notify Email
    runs-on: ubuntu-latest
    if: always()
    needs: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CASO 1: ERRO (Falha nos Testes ou no Deploy)
      - name: Send Failure Email to Dev
        if: needs.Deploy.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Falha no Pipeline - Moon
          body: |
            Ocorreu um erro no pipeline!
            Status dos Testes: ${{ needs.Test.result }}
            Status do Build: ${{ needs.Build.result }}
            Logs do erro aqui: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.MY_EMAIL }}
          from: Moon <${{ secrets.MAIL_USERNAME }}>

      # CASO 2: SUCESSO
      - name: Send Success Email to Client
        if: needs.Deploy.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Novidades do Bot Moon
          body: |
            Olá! Uma nova atualização da Moon está disponível.

            Acesse o bot atualizado no nosso servidor atualizado aqui: https://discord.gg/bHfrNHtCZK

            Atenciosamente,
            Equipe do Santuário Lunar
          to: ${{ secrets.MY_EMAIL }}
          from: Moon <${{ secrets.MAIL_USERNAME }}>